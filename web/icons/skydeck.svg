<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- skydeck (S2 12.12): a deck of three session cards on the page's accent colour, the front
       one with a prompt. Drawn on a grid of 4 units, one pixel at 16 pixels. scripts/icons.ts
       makes the PNG files and favicon.ico from this file; run it again after a change. -->
  <rect width="64" height="64" rx="16" fill="#2f6fde"/>
  <rect x="20" y="12" width="24" height="20" rx="3" fill="#9dbcf3"/>
  <rect x="16" y="20" width="32" height="20" rx="3" fill="#cbdcfa"/>
  <rect x="12" y="28" width="40" height="24" rx="4" fill="#ffffff"/>
  <path d="M22 35 L28 40 L22 45" fill="none" stroke="#2f6fde" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 45 H42" fill="none" stroke="#2f6fde" stroke-width="4" stroke-linecap="round"/>
</svg>
