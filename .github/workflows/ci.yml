name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is in the group so that a run started by hand on main has a group of its own:
  # otherwise the next merge would cancel the full run, and the full run would cancel a push run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Three kinds of job run side by side (S2 17.5), so that a pull request waits for its slowest job
# (about 10 minutes) and not for the sum of them (about 32 minutes when they ran in one job):
# - lint: the format check, both type checks, shellcheck and py_compile;
# - unit: `npm test`, in shards;
# - page: `npm run test:page`, in shards (Node 24 only).
# A shard is Node's own `--test-shard=i/n`: the sorted list of test files is cut into n parts by taking
# every n-th file, so no file is named here and a new test file needs no upkeep. The option is given
# as NODE_OPTIONS, not as `npm test -- --test-shard=i/n`: npm puts that argument after the glob, where
# `node --test` ignores it without a word and every shard would run the whole suite. To change the
# number of shards, change the `shard` list of the job: each entry holds the index and the count.
jobs:
  lint:
    name: lint (node ${{ matrix.leg.node }})
    runs-on: ${{ matrix.leg.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Two legs, but a pull request and a push to main run only the second. The first, the
        # oldest-Node leg, runs only when the workflow is started by hand (workflow_dispatch), and a
        # run started by hand runs both. That is the owner's decision, to save CI minutes: the
        # oldest-Node leg is run on main at checkpoints and when the work is done
        # (`gh workflow run CI --ref main`). The unit job has the same legs; the page job has only
        # the second.
        # - node '24.12': the oldest Node the launcher accepts, on the newest Ubuntu.
        # - node '24': the newest 24.x, on Ubuntu 24.04 (the development machine's): Playwright
        #   1.60.0 has no Chromium for 26.04, and the page job needs it. Drop the pin when
        #   Playwright is upgraded.
        leg: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"node":"24.12","os":"ubuntu-latest"},{"node":"24","os":"ubuntu-24.04"}]' || '[{"node":"24","os":"ubuntu-24.04"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.leg.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # By name: bin/skydeck-keeper is python, not sh (plan A14).
      - run: shellcheck bin/skydeck bin/skydeck-hook bin/skydeck-keepalive
      - run: python3 -m py_compile bin/skydeck-keeper

  unit:
    name: unit (node ${{ matrix.leg.node }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.leg.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The same legs as the lint job (see there).
        leg: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"node":"24.12","os":"ubuntu-latest"},{"node":"24","os":"ubuntu-24.04"}]' || '[{"node":"24","os":"ubuntu-24.04"}]') }}
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.leg.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}

  # The page suite (S2 17.4, 17.5): Node 24 only, with Chromium cached under the pinned Playwright's
  # version and the runner's system.
  page:
    name: page (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read the Playwright version and the system
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "system=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.system }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:page
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}
