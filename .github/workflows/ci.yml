name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    # The page suite's browser download and run (S2 17.5).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Node the launcher accepts, on the newest Ubuntu.
          - node: '24.12'
            os: ubuntu-latest
          # The newest 24.x, with the page suite, on Ubuntu 24.04 (the development machine's):
          # Playwright 1.60.0 has no Chromium for 26.04. Drop the pin when Playwright is upgraded.
          - node: '24'
            os: ubuntu-24.04
    name: check (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # `npm run check` without its last step, the page suite, which only the newest leg runs.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # By name: bin/skydeck-keeper is python, not sh (plan A14).
      - run: shellcheck bin/skydeck bin/skydeck-hook bin/skydeck-keepalive
      - run: python3 -m py_compile bin/skydeck-keeper
      # The page suite (S2 17.4, 17.5): Node 24 only, with Chromium cached under the pinned
      # Playwright's version and the runner's system.
      - name: Read the Playwright version and the system
        if: matrix.node == '24'
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "system=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.node == '24'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.system }}-${{ steps.playwright.outputs.version }}
      - if: matrix.node == '24'
        run: npx playwright install --with-deps chromium
      - if: matrix.node == '24'
        run: npm run test:page
